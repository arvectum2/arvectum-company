name: Golden Step Windows qualification
on:
  push:
    branches: [brand/identity-v3]
    paths:
      - 'brand/04_Цвет и типографика/Arvectum-Typeface-v0.60/qualification-kit/**'
      - '.github/workflows/brand-golden-step-windows.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: golden-step-windows-identity-v3
  cancel-in-progress: true
jobs:
  golden-step-windows:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Run self-contained GDI and WPF probes with private font registration
        shell: pwsh
        run: |
          $tool = 'brand/04_Цвет и типографика/Arvectum-Typeface-v0.60/qualification-kit/windows-qa.ps1'
          & powershell.exe -NoLogo -NoProfile -STA -ExecutionPolicy Bypass -File $tool
          if ($LASTEXITCODE -ne 0) { throw "Windows font probe failed: $LASTEXITCODE" }
      - name: Isolate short-name GDI registration in fresh PowerShell processes
        shell: pwsh
        run: |
          $base='brand/04_Цвет и типографика/Arvectum-Typeface-v0.60/qualification-kit'
          $manifest=Get-Content "$base/font-variants.json" -Raw -Encoding UTF8 | ConvertFrom-Json
          foreach ($rev in @(58,59)) {
            foreach ($style in @('Display','Text')) {
              $variant=$manifest.PSObject.Properties["$rev-$style"].Value
              $file=Join-Path "$base/fonts" $variant.alias_file
              $out=Join-Path "$base/results" "isolated-$rev-$style.json"
              & powershell.exe -NoProfile -STA -ExecutionPolicy Bypass -File "$base/single-gdi-probe.ps1" -FontPath $file -Family $variant.alias_family -OutputJson $out
              if ($LASTEXITCODE -ne 0) { throw "Isolated GDI process failed: $rev-$style" }
            }
          }
      - name: Evaluate probe output without claiming owner approval
        shell: pwsh
        run: |
          $p = 'brand/04_Цвет и типографика/Arvectum-Typeface-v0.60/qualification-kit/results/windows-qa.json'
          $result = Get-Content $p -Raw -Encoding UTF8 | ConvertFrom-Json
          if ($result.results.Count -ne 8) { throw "Expected 8 font probes" }
          $result.results | ForEach-Object {
            Write-Host "$($_.key): GDI $($_.gdi.gdi_exact_family) WPF $($_.wpf.resolved) GDI-height $($_.gdi.tmHeight) WPF-height $($_.wpf.height)"
          }
          $original = @($result.results | Where-Object { $_.key -match '-original$' })
          $wpf = @($result.results | Where-Object { $_.wpf.resolved -eq $true -and $_.wpf.glyph_face_uri -match '.OTF$' })
          $gdi = @($original | Where-Object { $_.gdi.gdi_exact_family -eq $true })
          if ($gdi.Count -ne 4 -or $wpf.Count -ne 8) { throw 'Original font selection and WPF verification incomplete' }
          foreach ($style in @('Display','Text')) {
            $b = $original | Where-Object { $_.key -eq "58-$style-original" }
            $c = $original | Where-Object { $_.key -eq "59-$style-original" }
            $pct = [Math]::Round(100*($c.gdi.tmHeight/$b.gdi.tmHeight-1),2)
            Write-Host "Legacy GDI line-height change $style : $($b.gdi.tmHeight) -> $($c.gdi.tmHeight) ($pct%)"
            if ($pct -gt 10) { Write-Host "::warning::v0.59 raises Win GDI line height by $pct%; DO NOT PROMOTE to production" }
            $shortFile = "brand/04_Цвет и типографика/Arvectum-Typeface-v0.60/qualification-kit/results/isolated-59-$style.json"
            if (Test-Path $shortFile) {
              $short = Get-Content $shortFile -Raw -Encoding UTF8 | ConvertFrom-Json
              Write-Host "Fresh-process alias GDI $style : registered=$($short.registered), actual=$($short.actual_face)"
            }
          }
          Write-Host 'DIAGNOSTIC PASS: results collected; owner/release gates remain NOT APPROVED'
      - name: Store Windows-only evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: golden-step-v060-windows-qa
          path: brand/04_Цвет и типографика/Arvectum-Typeface-v0.60/qualification-kit/results/
          if-no-files-found: warn
          retention-days: 14
