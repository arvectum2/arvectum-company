name: Company main integrity gate

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: company-main-integrity-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  company-main-integrity:
    name: company-main-integrity
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Canonical Company file presence and basic syntax
        run: |
          python3 - <<'PY'
          import ast
          from pathlib import Path
          for name in (
              "docs/constitution/COMPANY-CONSTITUTION.md",
              "docs/roadmap/ROADMAP.md",
              "docs/portfolio/PORTFOLIO.md",
          ):
              assert Path(name).is_file(), f"Canonical Company source absent: {name}"
          for folder in ("tools", "tests"):
              for path in Path(folder).rglob("*.py"):
                  if "__pycache__" not in path.parts:
                      ast.parse(path.read_text(encoding="utf-8"), filename=str(path))
          print("COMPANY_SOURCE_PRESENCE_AND_PYTHON_AST_PASS")
          PY
      - name: Required gate and source-pack automation safety tests
        run: python3 -B -m unittest discover -s tests -p 'test_company_main_gate_policy.py' -q
      - name: Source-pack canonical registry preservation tests
        run: python3 -B -m unittest discover -s tests -p 'test_build_project_sources_safety.py' -q
      - name: Offline Company AEC regression suite
        run: python3 -B -m unittest discover -s tests -p 'test_aec001*.py' -q
