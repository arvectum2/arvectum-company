name: Build ChatGPT Project Sources

on:
  push:
    branches:
      - main
    paths:
      - 'tools/build_project_sources.py'
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: build-project-sources
  cancel-in-progress: false

jobs:
  build:
    name: Build and publish source pack
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout Arvectum Company
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify anonymous canonical OS source access (fail closed)
        run: |
          set -euo pipefail
          export GIT_TERMINAL_PROMPT=0
          if ! git ls-remote --exit-code https://github.com/arvectum/arvectum-os.git refs/heads/main >/dev/null 2>&1; then
            echo "::error title=Arvectum OS source unavailable::Canonical OS Git main is not accessible. No source pack will be generated or published. Owner approval of cross-repository read and public source scope is required."
            exit 2
          fi

      - name: Checkout canonical Arvectum OS
        run: |
          set -euo pipefail
          git clone --depth 1 --branch main https://github.com/arvectum/arvectum-os.git /tmp/arvectum-os

      - name: Build Project Source bundles and registry
        run: |
          set -euo pipefail
          python3 tools/build_project_sources.py \
            --os-repo /tmp/arvectum-os \
            --output docs/project-sources \
            --registry docs/CANONICAL-SOURCES.md

      - name: Validate generated set
        run: |
          set -euo pipefail
          test -f docs/CANONICAL-SOURCES.md
          test "$(find docs/project-sources -maxdepth 1 -type f -name '*_ARVECTUM_OS_*.md' | wc -l | tr -d ' ')" = "7"
          grep -q 'Convenience Snapshot / Non-Canonical Copy' docs/project-sources/01_ARVECTUM_OS_CONSTITUTION.md
          grep -q 'Proposed `0.2.1`' docs/CANONICAL-SOURCES.md

      - name: Propose generated sources through a draft PR (never push main)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git add docs/project-sources docs/CANONICAL-SOURCES.md
          if git diff --cached --quiet; then
            echo "Project Source pack is already current."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          os_sha="$(git -C /tmp/arvectum-os rev-parse HEAD)"
          branch="automation/project-source-review-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          git switch -c "$branch"
          git commit -m "docs: propose source pack from Arvectum OS ${os_sha:0:12}"
          git push origin "HEAD:refs/heads/$branch"
          gh pr create --base main --head "$branch" --draft \
            --title "docs: review generated Arvectum OS project sources" \
            --body "Generated non-canonical convenience snapshot from pinned OS commit $os_sha. Requires independent owner review and the always-running Company main integrity gate before merge. No automation may approve or merge this PR."

      - name: Summary
        run: |
          os_sha="$(git -C /tmp/arvectum-os rev-parse HEAD)"
          echo "### Arvectum Company Project Source pack" >> "$GITHUB_STEP_SUMMARY"
          echo "- Canonical OS commit: \`$os_sha\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- Generated bundles: \`7\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- Registry: \`docs/CANONICAL-SOURCES.md\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- Generated files are non-canonical convenience snapshots." >> "$GITHUB_STEP_SUMMARY"
