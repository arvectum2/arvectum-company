name: Source section review
on:
  pull_request:
    paths:
      - 'brand/specs/001-brand-identity-traceability/**'
      - 'brand/00_Управление/ROADMAP-DRAFT.md'
      - 'brand/00_Управление/HISTORY-AND-RESUME.md'
      - '.github/workflows/source-section-review.yml'
permissions:
  contents: read
jobs:
  source-section-review:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python brand/specs/001-brand-identity-traceability/checks/check_section_review.py
      - run: python -m unittest discover -s brand/specs/001-brand-identity-traceability/checks -p test_section_review.py
