<!doctype html><html lang="ru"><head><meta charset="utf-8"><title>Арвектум / визитка — макет</title><link rel="stylesheet" href="../tokens.css"><style>
@page{size:90mm 50mm;margin:0}body{background:#e8edf0}.card{width:90mm;height:50mm;break-after:page;background:white;position:relative;overflow:hidden;padding:8mm 8mm 6mm}.card:last-child{break-after:auto}
.logo{width:53mm;height:auto}.name{font:15pt/1.18 var(--font-display);margin-top:8mm}.role{font:9pt/1.3 var(--font-text);margin-top:1.3mm;color:var(--dark-teal)}.site{font:9pt/1.5 Arial,sans-serif;position:absolute;bottom:5.5mm;right:8mm;color:var(--navy)}
.reverse{background:var(--navy);display:flex;align-items:center;gap:8mm}.reverse img{width:24mm;height:auto}.reverse .backsite{color:#fff;font:12pt/1.3 var(--font-display)}
@media screen{.card{margin:40px auto;box-shadow:0 5px 20px #adbec45a}}
</style></head><body>
<div class="card"><img class="logo" src="../assets/lockup_ru.svg" alt="Арвектум"><div class="name">[Имя Фамилия]</div><div class="role">[должность / отдел]</div><div class="site">arvectum.com</div></div>
<div class="card reverse"><img src="../assets/monogram_mint.svg" alt="Знак Golden Vector"><div class="backsite">Интеллект<br>в действии.</div></div>
</body></html>
